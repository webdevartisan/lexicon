<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Vernissage theme preview">
  <defs>
    <filter id="ver-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1a1914" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- plaster walls, one wall of viridian -->
  <rect width="1200" height="900" fill="#f4f1e9"/>
  <rect x="780" width="420" height="900" fill="#1d4f3a"/>
  <!-- floor line -->
  <line x1="0" y1="812" x2="1200" y2="812" stroke="#1a1914" stroke-opacity="0.15" stroke-width="2"/>

  <!-- masthead -->
  <text x="80" y="86" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="5" fill="#7a7565">PRIVATE VIEW · WORKS ON PAPER</text>
  <text x="1120" y="86" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="5" fill="#d9e2d3">ROOM II</text>

  <!-- display title -->
  <text x="76" y="250" font-family="'Bodoni MT', Didot, Georgia, serif" font-size="140" letter-spacing="-2" fill="#1a1914">Vernissage</text>
  <text x="80" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#35332a">The doors open at seven; the ink is barely dry.</text>

  <!-- framed works on the plaster wall -->
  <g filter="url(#ver-shadow)">
    <rect x="96" y="392" width="272" height="330" fill="#faf8f2" stroke="#1a1914" stroke-width="2"/>
  </g>
  <rect x="128" y="424" width="208" height="220" fill="#d9e2d3"/>
  <rect x="128" y="424" width="208" height="220" fill="none" stroke="#1a1914" stroke-opacity="0.15"/>
  <rect x="128" y="676" width="120" height="10" rx="5" fill="#7a7565" opacity="0.6"/>

  <g filter="url(#ver-shadow)">
    <rect x="432" y="392" width="272" height="330" fill="#faf8f2" stroke="#1a1914" stroke-width="2"/>
  </g>
  <rect x="464" y="424" width="208" height="220" fill="#eae5d9"/>
  <circle cx="568" cy="534" r="72" fill="#1d4f3a" fill-opacity="0.85"/>
  <rect x="464" y="676" width="96" height="10" rx="5" fill="#7a7565" opacity="0.6"/>

  <!-- the work on the viridian wall -->
  <g filter="url(#ver-shadow)">
    <rect x="852" y="368" width="276" height="354" fill="#faf8f2"/>
  </g>
  <rect x="884" y="400" width="212" height="244" fill="#f4f1e9"/>
  <g stroke="#123527" stroke-width="7" fill="none">
    <line x1="920" y1="596" x2="1060" y2="440"/>
    <line x1="920" y1="440" x2="1008" y2="596"/>
  </g>
  <rect x="884" y="676" width="132" height="10" rx="5" fill="#0c271c" opacity="0.6"/>

  <!-- caption -->
  <text x="80" y="860" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#7a7565">EVERY POST HANGS IN ITS OWN FRAME</text>
  <text x="1120" y="860" text-anchor="end" font-family="'Bodoni MT', Didot, Georgia, serif" font-size="21" font-style="italic" fill="#d9e2d3">No. 14</text>
</svg>
