---
subject: New on {{ blog_name }}: {{ post_title }}
preheader: {{ blog_name }} just published a new post.
footer_note: You received this email because you subscribed to {{ blog_name }}. <a href="{{ unsubscribe_url }}" target="_blank" style="color:#374151;text-decoration:underline;">Unsubscribe</a>
---
          <!-- Content > Heading -->
          <tr>
            <td class="section-padding" style="padding:32px 40px 8px;">
              <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;font-weight:bold;color:{{ primary_color }};">
                New on {{ blog_name }}
              </p>
              <h1 class="main-heading" style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:36px;font-weight:bold;color:#111827;">
                {{ post_title }}
              </h1>
            </td>
          </tr>
          <!-- Actions > Primary button -->
          <tr>
            <td class="section-padding" align="{{ start }}" style="padding:8px 40px 24px;">

              <!--[if mso]>
              <v:roundrect href="{{ post_url }}" style="height:48px;v-text-anchor:middle;width:240px;" arcsize="12%" stroked="f" fillcolor="{{ primary_color }}">
                <w:anchorlock xmlns:w="urn:schemas-microsoft-com:office:word"/>
                <center style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#FFFFFF;">
                  Read it
                </center>
              </v:roundrect>
              <![endif]-->

              <!--[if !mso]><!-->
              <table class="mobile-button" role="presentation" cellpadding="0" cellspacing="0" border="0" width="240" style="width:240px;border-collapse:separate;">
                <tr>
                  <td align="center" bgcolor="{{ primary_color }}" style="background-color:{{ primary_color }};border-radius:6px;">
                    <a href="{{ post_url }}" target="_blank" style="display:block;padding:14px 16px;border:1px solid {{ primary_color }};border-radius:6px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;font-weight:bold;text-align:center;text-decoration:none;color:#FFFFFF;">
                      Read it
                    </a>
                  </td>
                </tr>
              </table>
              <!--<![endif]-->

            </td>
          </tr>
          <!-- Spacing before the footer -->
          <tr>
            <td style="padding:0 0 16px;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
