---
name: Default
primary_color: #4F46E5
background_color: #F3F4F6
support_email:
company_address:
---
<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <title>{{ subject }}</title>

  <!-- Outlook document settings -->
  <!--[if mso]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG/>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->

  <style>
    body { margin:0; padding:0; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
    a { color:inherit; }
    @media only screen and (max-width:620px) {
      .outer-padding { padding:16px 8px !important; }
      .section-padding { padding-left:20px !important; padding-right:20px !important; }
      .main-heading { font-size:26px !important; line-height:34px !important; }
      .mobile-button { width:100% !important; }
    }
  </style>
</head>

<body style="margin:0;padding:0;background-color:{{ background_color }};" dir="{{ dir }}">

  <!-- Layout > Hidden preheader -->
  <div style="display:none;font-size:1px;line-height:1px;color:{{ background_color }};max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
    {{ preheader }}
  </div>

  <!-- Layout > Outer wrapper -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="{{ background_color }}" style="width:100%;background-color:{{ background_color }};border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
    <tr>
      <td class="outer-padding" align="center" style="padding:32px 16px;">

        <!--[if mso]>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" align="center">
          <tr>
            <td>
        <![endif]-->

        <!-- Layout > Main container -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#FFFFFF" style="width:100%;max-width:600px;background-color:#FFFFFF;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;text-align:{{ start }};">

          <!-- Layout > Header -->
          <tr>
            <td class="section-padding" style="padding:24px 40px;border-bottom:1px solid #E5E7EB;">
              <a href="{{ app_url }}" target="_blank" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:28px;font-weight:bold;color:#111827;text-decoration:none;">{{ app_name }}</a>
            </td>
          </tr>

          <!-- The email -->
          {{ content }}

          <!-- Layout > Footer -->
          <tr>
            <td class="section-padding" bgcolor="#F9FAFB" style="padding:24px 40px;background-color:#F9FAFB;border-top:1px solid #E5E7EB;">
              <p style="margin:0 0 12px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#4B5563;">
                {{ footer_note }}
              </p>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#4B5563;">
                &copy; {{ year }} {{ app_name }}<br>
                {{ company_address }}
              </p>
            </td>
          </tr>

        </table>

        <!--[if mso]>
            </td>
          </tr>
        </table>
        <![endif]-->

      </td>
    </tr>
  </table>

</body>
</html>
